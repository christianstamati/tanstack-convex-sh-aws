# Checks pull requests and main: `bun run ready` (format, lint, type check, tests and the
# production build), a dependency audit, and a security audit of these workflows. It needs no
# secrets: convex/_generated/ is committed and convex-test runs the Convex functions in memory.
# Deploys stay with Workers Builds (scripts/cloudflare.ts).
name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Weekly, for the audit only: a new advisory can hit a lockfile that hasn't changed.
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

# A new push to a pull request cancels the run for its previous commit.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # main's ruleset (.github/rulesets/main.json) requires this job's check by its name, and the
  # Workers build runs no checks of its own. Renaming it lets failing code reach production.
  ready:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      # Reads the version from `packageManager` in package.json.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      - run: bun run ready

  # Reads advisories for the versions in bun.lock; no install needed.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      # What ships: the Worker and the Convex functions. Fails on high and critical advisories.
      # To accept one, add `--ignore=<GHSA id>` here with a comment saying why.
      - name: Audit production dependencies
        run: bun audit --prod --audit-level=high

      # Dev tooling (the Cloudflare CLI, the shadcn CLI…) runs only on developer machines and in CI, so its
      # advisories go to the job summary without failing the job.
      - name: Report all advisories
        if: ${{ !cancelled() }}
        run: |
          status=0
          bun audit > audit.txt 2>&1 || status=$?
          {
            echo "## bun audit, dev dependencies included"
            echo '```'
            cat audit.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then echo "::warning::bun audit found advisories, see the job summary."; fi

  # Audits these workflows for security problems: broad permissions, unpinned actions,
  # credentials left in checkouts, template injection.
  workflows:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # renovate: datasource=github-releases depName=zizmorcore/zizmor extractVersion=^v(?<version>.+)$
      ZIZMOR_VERSION: "1.31.1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Prints findings and fails the job, without uploading them to code scanning.
      - uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          version: ${{ env.ZIZMOR_VERSION }}
          advanced-security: false
