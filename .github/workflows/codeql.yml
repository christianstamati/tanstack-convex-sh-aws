# CodeQL code scanning for the TypeScript code and these workflows. Results appear under the
# repo's Security > Code scanning, and on pull requests as the "CodeQL" check. Code scanning is
# free on public repos; a private copy needs GitHub Advanced Security, so the job skips there.
# main's ruleset (.github/rulesets/main.json) blocks merging a pull request with a
# high-severity security alert or an error-level alert.
name: CodeQL

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # Uploads the results to code scanning.
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          # Generated code and the Convex agent skills aren't ours to fix.
          config: |
            paths-ignore:
              - "**/convex/_generated/**"
              - "**/routeTree.gen.ts"
              - "**/.agents/**"
              - "**/.claude/skills/**"

      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}
